services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: team-pm-backend

    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:tranbach123@postgres:5432/my-project-postgres
      RABBITMQ_URL: amqp://root:tranbach123@rabbitmq:5672
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 1h

    depends_on:
      - postgres
      - redis
      - rabbitmq

    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared:/app/packages/shared
  postgres:
    image: postgres:16
    container_name: my-project-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tranbach123
      POSTGRES_DB: dev_board

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: team-pm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: team-pm-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: team-pm-frontend
    environment:
      VITE_API_URL: /api
    expose:
      - "80"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: team-pm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: tranbach123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
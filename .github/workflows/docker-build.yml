name: Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/team-pm-backend:latest \
            -f apps/backend/Dockerfile \
            .

      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/team-pm-frontend:latest \
            -f apps/frontend/Dockerfile \
            .

      - name: Push Backend Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/team-pm-backend:latest

      - name: Push Frontend Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/team-pm-frontend:latest
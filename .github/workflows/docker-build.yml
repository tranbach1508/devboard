name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t team-pm-backend:ci \
            ./apps/backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t team-pm-frontend:ci \
            ./apps/frontend
            
      - name: List Docker images
        run: docker images